        // ==========================================
        // FUNCIÓN PARA DETERMINAR LA RELACIÓN
        // UTILIZADA EN LAS TABLAS
        // ==========================================

        function obtenerRelacionTabla(relacion) {

            if (relacion >= 0.50 && relacion < 0.55) {
                return 0.50;
            }

            if (relacion === 0.55) {
                return 0.55;
            }

            if (relacion > 0.55 && relacion < 0.65) {
                return 0.60;
            }

            if (relacion === 0.65) {
                return 0.65;
            }

            if (relacion > 0.65 && relacion < 0.75) {
                return 0.70;
            }

            if (relacion === 0.75) {
                return 0.75;
            }

            if (relacion > 0.75 && relacion < 0.85) {
                return 0.80;
            }

            if (relacion === 0.85) {
                return 0.85;
            }

            if (relacion > 0.85 && relacion < 0.95) {
                return 0.90;
            }

            if (relacion === 0.95) {
                return 0.95;
            }

            if (relacion > 0.95 && relacion <= 1.00) {
                return 1.00;
            }

            return null;
        }


        // ==========================================
        // FUNCIÓN PRINCIPAL
        // ==========================================

        function procesarLosa() {

            let a =
                Number(document.getElementById("luzCorta").value);

            let b =
                Number(document.getElementById("luzLarga").value);

            let CM =
                Number(document.getElementById("cargaMuerta").value);

            let CV =
                Number(document.getElementById("cargaViva").value);

            let caso =
                document.getElementById("caso").value;


            // ==========================================
            // VERIFICAR DATOS
            // ==========================================

            if (
                a <= 0 ||
                b <= 0 ||
                CM < 0 ||
                CV < 0 ||
                caso === ""
            ) {

                alert(
                    "Completa todos los datos correctamente."
                );

                return;
            }


            // ==========================================
            // VERIFICAR LUZ CORTA Y LUZ LARGA
            // ==========================================

            if (b < a) {

                alert(
                    "La luz larga (b) debe ser mayor o igual que la luz corta (a)."
                );

                return;
            }


            // ==========================================
            // RELACIÓN ORIGINAL a/b
            // ==========================================

            let relacion = a / b;


            // ==========================================
            // VERIFICAR RANGO
            // ==========================================

            if (
                relacion < 0.50 ||
                relacion > 1.00
            ) {

                alert(
                    "La relación a/b debe estar entre 0.50 y 1.00."
                );

                return;
            }


            // ==========================================
            // RELACIÓN UTILIZADA EN TABLAS
            // ==========================================

            let relacionTabla =
                obtenerRelacionTabla(relacion);


            if (relacionTabla === null) {

                alert(
                    "No se pudo determinar la relación correspondiente en las tablas."
                );

                return;
            }


            // ==========================================
            // OBTENER DATOS DE LAS TABLAS
            // ==========================================

            let datosTablaCV =
                tablaCMV[relacionTabla];


            let datosTablaCM =
                tablaCM[relacionTabla];


            let datosTablaNegativo =
                tablaNegativo[relacionTabla];


            let datosTablaW =
                tablaW[relacionTabla];


            // ==========================================
            // VERIFICAR QUE EXISTAN LOS DATOS
            // ==========================================

            if (
                !datosTablaCV ||
                !datosTablaCM ||
                !datosTablaNegativo ||
                !datosTablaW
            ) {

                alert(
                    "No se encontró esta relación en las tablas."
                );

                return;
            }


            // ==========================================
            // NÚMERO DE CASO
            // ==========================================

            let numeroCaso =
                Number(caso);


            // ==========================================
            // COEFICIENTES DE MOMENTO POSITIVO
            // CARGA VIVA
            // ==========================================

            let CaCV =
                datosTablaCV.Ca[numeroCaso - 1];


            let CbCV =
                datosTablaCV.Cb[numeroCaso - 1];


            // ==========================================
            // COEFICIENTES DE MOMENTO POSITIVO
            // CARGA MUERTA
            // ==========================================

            let CaCM =
                datosTablaCM.Ca[numeroCaso - 1];


            let CbCM =
                datosTablaCM.Cb[numeroCaso - 1];


            // ==========================================
            // COEFICIENTES DE MOMENTO NEGATIVO
            // CARGA VIVA + CARGA MUERTA
            // ==========================================

            let CaNeg =
                datosTablaNegativo.Ca[numeroCaso - 1];


            let CbNeg =
                datosTablaNegativo.Cb[numeroCaso - 1];


            // ==========================================
            // COEFICIENTES DE CORTANTE
            // ==========================================

            let Wa =
                datosTablaW.Wa[numeroCaso - 1];


            let Wb =
                datosTablaW.Wb[numeroCaso - 1];


            // ==========================================
            // MOSTRAR RESULTADOS
            // ==========================================

            document.getElementById("resultado").innerHTML =

                "<strong>RESULTADOS</strong><br><br>" +

                "Luz corta a = "
                + a.toFixed(2)
                + " m<br>" +

                "Luz larga b = "
                + b.toFixed(2)
                + " m<br>" +

                "Relación a/b = "
                + relacion.toFixed(3)
                + "<br>" +

                "<strong>Relación utilizada en tablas = "
                + relacionTabla.toFixed(2)
                + "</strong><br>" +

                "Carga muerta CM = "
                + CM.toFixed(2)
                + " kg/m²<br>" +

                "Carga viva CV = "
                + CV.toFixed(2)
                + " kg/m²<br>" +

                "Caso de apoyo = Caso "
                + caso
                + "<br><br>" +


                // ==========================================
                // MOMENTO NEGATIVO
                // ==========================================

                "<strong>COEFICIENTES DE MOMENTO NEGATIVO - CARGA VIVA + CARGA MUERTA</strong><br><br>" +

                "Ca-neg = "
                + (CaNeg !== null ? CaNeg : "—")
                + "<br>" +

                "Cb-neg = "
                + (CbNeg !== null ? CbNeg : "—")
                + "<br><br>" +


                // ==========================================
                // MOMENTO POSITIVO - CARGA MUERTA
                // ==========================================

                "<strong>COEFICIENTES DE MOMENTO POSITIVO - CARGA MUERTA</strong><br><br>" +

                "Ca-CM = "
                + CaCM
                + "<br>" +

                "Cb-CM = "
                + CbCM
                + "<br><br>" +


                // ==========================================
                // MOMENTO POSITIVO - CARGA VIVA
                // ==========================================

                "<strong>COEFICIENTES DE MOMENTO POSITIVO - CARGA VIVA</strong><br><br>" +

                "Ca-CV = "
                + CaCV
                + "<br>" +

                "Cb-CV = "
                + CbCV
                + "<br><br>" +


                // ==========================================
                // CORTANTES
                // ==========================================

                "<strong>COEFICIENTES PARA CORTANTES</strong><br><br>" +

                "Wa = "
                + Wa
                + "<br>" +

                "Wb = "
                + Wb;

        }


    </script>

</body>

</html>
